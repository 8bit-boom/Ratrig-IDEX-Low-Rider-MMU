# Append this to printer.cfg, AFTER [include RatOS.cfg] and AFTER Happy Hare's
# own generated MMU includes. See docs/02-installation.md step 5.

[include mmu/mmu_pins_lowrider.cfg]
[include mmu/mmu_parameters_lowrider.cfg]
[include mmu/mmu_hardware_lowrider.cfg]
[include RatOS/idex_mmu_integration.cfg]

# The right toolhead's extruder needs enough extrude-only headroom for Happy
# Hare's toolhead load/unload moves (extruder entrance to nozzle, tip forming,
# purging) and Klipper's own default max_extrude_only_distance (50mm) is too
# small for that. Note: the long gate-to-extruder-sensor move on this MMU (its
# `gate_homing_max`) runs on the MMU's own dedicated gear stepper, not through
# this extruder's motion queue, so this override doesn't need to cover that
# whole distance -- generous headroom here is just cheap insurance. Left
# toolhead (extruder) is untouched since it's never driven by the MMU.
[extruder1]
max_extrude_only_accel: 5000
max_extrude_only_velocity: 200
max_extrude_only_distance: 500
max_extrude_cross_section: 999
