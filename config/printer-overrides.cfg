# Append this to printer.cfg, AFTER [include RatOS.cfg] and AFTER Happy Hare's
# own generated MMU includes. See docs/02-installation.md step 5.

[include mmu/mmu_parameters_lowrider.cfg]
[include mmu/mmu_hardware_lowrider.cfg]
[include RatOS/idex_mmu_integration.cfg]

# The right toolhead's extruder needs to accept the long extrude-only moves
# Happy Hare issues during MMU load/unload (bowden move + toolhead load can each
# be several hundred mm). Klipper's defaults are far too small for this and will
# raise "Move exceeds maximum extrusion" errors mid-toolchange. Left toolhead
# (extruder) is untouched since it's never driven by the MMU.
[extruder1]
max_extrude_only_accel: 5000
max_extrude_only_velocity: 200
max_extrude_only_distance: 500
max_extrude_cross_section: 999
