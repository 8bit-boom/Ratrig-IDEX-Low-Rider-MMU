# Happy Hare pin-alias override for the Low Rider MMU v2.0's BTT EBB42 v1.2 CAN
# toolboard. This is Happy Hare's `[board_pins mmu]` alias mechanism (normally
# generated into ~/printer_data/config/mmu/mmu.cfg by the installer) --
# reproduced here as an override so it's easy to diff against the build guide.
#
# Destination: ~/printer_data/config/mmu/mmu_pins_lowrider.cfg
# Include this AFTER Happy Hare's generated `mmu.cfg` (which already declares
# `[mcu mmu]` pointing at the EBB42's CAN UUID/serial from the installer) and
# BEFORE mmu_hardware_lowrider.cfg, which references these aliases.
#
# Values match GcodeGearhead's official Low Rider MMU V2.0 Build Guide's own
# reference wiring exactly. If you wired your EBB42 differently, edit here --
# nowhere else needs to change.

[board_pins mmu]
mcu: mmu
aliases:
    MMU_GEAR_UART=PA15,
    MMU_GEAR_STEP=PD0,
    MMU_GEAR_DIR=PD1,
    MMU_GEAR_ENABLE=PD2,

    MMU_SEL_SERVO=PA3,
    MMU_NEOPIXEL=PD3,

    MMU_PRE_GATE_0=PB6,
    MMU_PRE_GATE_1=PB5,
    MMU_PRE_GATE_2=PB7,
    MMU_PRE_GATE_3=PB8,
    MMU_PRE_GATE_4=PB9,
    MMU_PRE_GATE_5=PB4
