# Happy Hare parameter overrides for the Low Rider MMU v2.0 feeding the RatOS
# right toolhead (dual_carriage 1 / extruder1) only.
#
# Destination: ~/printer_data/config/mmu/mmu_parameters_lowrider.cfg
# Include this AFTER Happy Hare's own generated `mmu/base/mmu_parameters.cfg` --
# Klipper merges the repeated `[mmu]` section, so only the keys listed here
# change; everything else keeps Happy Hare's generated defaults.
#
# Values grounded in GcodeGearhead's official Low Rider MMU V2.0 Build Guide
# (PDF supplied by the user), corrected for this repo's IDEX right-toolhead
# setup. Anything marked <FILL_IN> is explicitly build-specific per the guide
# itself (they say so directly) -- not something a generic config can supply.

[mmu]
# ---------------------------------------------------------------------------
# THE critical setting for this build: bind Happy Hare to the RIGHT toolhead's
# extruder (RatOS dual_carriage 1), NOT the default 'extruder' (left toolhead).
# If your MMU instead feeds the LEFT toolhead, set this back to 'extruder' and
# mirror the change in config/macros/idex_mmu_integration.cfg.
# ---------------------------------------------------------------------------
extruder: extruder1

# ---------------------------------------------------------------------------
# Gate homing/parking. This MMU has no gate sensor and no encoder -- it homes
# gate loads against the RIGHT TOOLHEAD's extruder entry sensor instead (see
# extruder_switch_pin in mmu_hardware_lowrider.cfg). This is straight from the
# build guide, not a generic Type-A default.
# ---------------------------------------------------------------------------
gate_homing_endstop: extruder
gate_homing_max: <FILL_IN: measure the distance from a gate to your right toolhead's extruder sensor -- the reference build used 1310mm, yours will differ with tube routing>
gate_parking_distance: <FILL_IN: parking position back from the homing point -- reference build used 1200mm, tune during calibration>
gate_preload_homing_max: 70
gate_preload_parking_distance: 0
gate_unload_buffer: 50
gate_autoload: 1		# pre-gate sensors are fitted -- enables auto-load on insert
gate_final_eject_distance: <FILL_IN: reference build used 1300mm -- distance to eject on MMU_EJECT, tune with the above>

# No extruder-collision or gear-touch homing needed -- gate homing above uses
# the toolhead sensor directly, so leave extruder_homing_endstop at Happy
# Hare's generated default (only relevant when NOT using a toolhead sensor).

# ---------------------------------------------------------------------------
# Selector servo. Angles are PER-MACHINE (assembly tolerance + which CAM
# generation you printed) -- do not trust these numbers, they are the build
# guide's own reference starting point for a 6-gate build. Calibrate with
# MMU_SELECT + SET_SERVO per docs/05-calibration.md, then paste the real
# angles back in here. For a 4-gate build you only need the first 4 values.
# ---------------------------------------------------------------------------
selector_gate_angles: <FILL_IN: calibrate per docs/05-calibration.md -- reference build starting point was 26,58,90,118 for gates 0-3>
selector_bypass_angle: -1
servo_duration: 0.6
servo_dwell: 1.0
servo_always_active: 0

# ---------------------------------------------------------------------------
# Motor sync (build guide: "The motors should be synced as the latest version
# of Happy Hare requires it for better operation").
# ---------------------------------------------------------------------------
sync_to_extruder: 1
sync_gear_current: 70		# % of gear_stepper current when synced during print -- tune down further if it runs hot
sync_form_tip: 1
sync_purge: 1

# ---------------------------------------------------------------------------
# Stepper current: build guide's own guidance for the NEMA17 on the EBB42.
# (This mirrors run_current in mmu_hardware_lowrider.cfg -- keep them consistent.)
# ---------------------------------------------------------------------------
# run_current = 0.85 * motor rated current, capped at 1.0A for the EBB42.

# ---------------------------------------------------------------------------
# Tip forming. Default to Happy Hare's standard in-MMU tip former unless you
# added the optional toolhead filament cutter -- if you did, switch to
# _MMU_CUT_TIP and configure base/mmu_cut_tip.cfg with YOUR toolhead's cutter
# geometry (the build guide's own cutter coordinates are specific to their
# printer and must not be copied).
# ---------------------------------------------------------------------------
form_tip_macro: _MMU_FORM_TIP		# change to _MMU_CUT_TIP only if you fitted a cutter
force_form_tip_standalone: 1
extruder_form_tip_current: 100
slicer_tip_park_pos: 0

# Toolhead physical dimensions -- placeholders, not measurements. Calibrate
# with `MMU_CALIBRATE_TOOLHEAD` (needs the toolhead sensor) per the Happy Hare
# wiki, then let it overwrite these.
toolhead_extruder_to_nozzle: <FILL_IN: measure or use MMU_CALIBRATE_TOOLHEAD>
toolhead_sensor_to_nozzle: <FILL_IN: measure or use MMU_CALIBRATE_TOOLHEAD, if toolhead sensor fitted>
