# Happy Hare parameter overrides for the Low Rider MMU v2.0 feeding the RatOS
# right toolhead (dual_carriage 1 / extruder1) only.
#
# Destination: ~/printer_data/config/mmu/mmu_parameters_lowrider.cfg
# Include this AFTER Happy Hare's own generated `mmu/base/mmu_parameters.cfg` --
# Klipper merges the repeated `[mmu]` section, so only the keys listed here change;
# everything else keeps Happy Hare's generated defaults.

[mmu]
# ---------------------------------------------------------------------------
# THE critical setting for this build: bind Happy Hare to the RIGHT toolhead's
# extruder (RatOS dual_carriage 1), NOT the default 'extruder' (left toolhead).
# If your MMU instead feeds the LEFT toolhead, set this back to 'extruder' and
# mirror the change in config/macros/idex_mmu_integration.cfg.
# ---------------------------------------------------------------------------
extruder: extruder1

# ---------------------------------------------------------------------------
# No filament encoder on this build (see docs/01-hardware-overview.md) --
# use the shared gate sensor for gate parking instead. If you don't fit
# `gate_switch_pin` in mmu_hardware_lowrider.cfg, change this to 'mmu_gear'
# and add per-gate `post_gear_switch_pin_N` sensors instead.
# ---------------------------------------------------------------------------
gate_homing_endstop: mmu_gate

# No encoder and no sync-feedback buffer sensor assumed -> can't home to the
# extruder gears by collision or compression. This is fine and accurate AS LONG
# AS you fit a toolhead sensor (`toolhead_switch_pin` in mmu_hardware_lowrider.cfg)
# -- Happy Hare then homes on that instead and ignores this setting. If you did
# NOT fit a toolhead sensor, you must fit a sync-feedback or stallguard setup and
# change this to 'filament_compression' or 'mmu_gear_touch' -- 'none' with no
# toolhead sensor either means Happy Hare cannot verify the load reached the
# extruder at all, which is not a safe default for unattended printing.
extruder_homing_endstop: none

# Type-B gear steppers on this MMU are not synced to the extruder during
# calibration by default; leave Happy Hare's generated `sync_to_extruder`
# default as-is (0) to start, and only enable it later once basic loading is
# reliable -- see docs/05-calibration.md.

# Toolhead physical dimensions -- these are placeholders, not measurements.
# Calibrate with `MMU_CALIBRATE_TOOLHEAD` (needs the toolhead sensor above) per
# the Happy Hare wiki, then let it overwrite these.
toolhead_extruder_to_nozzle: <FILL_IN: measure or use MMU_CALIBRATE_TOOLHEAD, starter e.g. 72>
toolhead_sensor_to_nozzle: <FILL_IN: measure or use MMU_CALIBRATE_TOOLHEAD, starter e.g. 62>
