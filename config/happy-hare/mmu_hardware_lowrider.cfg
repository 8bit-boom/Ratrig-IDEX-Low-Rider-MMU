# Happy Hare hardware override for the Low Rider MMU v2.0 (4 gates)
#
# Destination: ~/printer_data/config/mmu/mmu_hardware_lowrider.cfg
# Include this AFTER Happy Hare's own generated `mmu/base/mmu_hardware.cfg` so
# these section overrides win (Klipper merges repeated section names across
# included files; values here replace the generated defaults for the same keys).
#
# Grounded in GcodeGearhead's official Low Rider MMU V2.0 Build Guide (PDF
# supplied by the user). The Low Rider MMU is a Type-A MMU: ONE shared NEMA17
# gear stepper + ONE MG996R servo driving a CAM selector (`ServoSelector`) --
# NOT one gear stepper per gate. Controller is a single BTT EBB42 v1.2 CAN
# toolboard mounted on the MMU. Pins below match the build guide's own
# `[board_pins mmu]` alias block for their reference wiring -- verify against
# your own soldering if you deviated. `<FILL_IN: ...>` marks values the build
# guide itself says are build-specific and must be measured/tuned on your unit.

[mmu_machine]
num_gates: 4
mmu_vendor: MMX
mmu_version: 1.0
# selector_type, variable_bowden_lengths, variable_rotation_distances,
# filament_always_gripped and has_bypass all come from the MMX vendor preset
# (ServoSelector, 0, 0, 1, 0) and don't need to be restated here. The one
# thing the build guide explicitly overrides is:
require_bowden_move: 0		# 0 = no distinct bowden phase -- this MMU's single gear
				# drives filament the whole way to the toolhead sensor in
				# one modeled move. The build guide never calibrates a
				# bowden length (no MMU_CALIBRATE_BOWDEN step) -- confirms this.

# --------------------------------------------------------------------------------
# GEAR STEPPER -- one NEMA17, shared by all gates via the 80T gear/belt train.
# --------------------------------------------------------------------------------
[tmc2209 stepper_mmu_gear]
uart_pin: mmu:MMU_GEAR_UART
run_current: <FILL_IN: 0.85 x your NEMA17's rated current, capped at 1.0A -- the EBB42's own driver limit, per the build guide>
hold_current: 0.1
interpolate: True
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_mmu_gear]
step_pin: mmu:MMU_GEAR_STEP
dir_pin: !mmu:MMU_GEAR_DIR
enable_pin: !mmu:MMU_GEAR_ENABLE
rotation_distance: <FILL_IN: starter value -- overridden by MMU_CALIBRATE_GEAR, see docs/05-calibration.md>
microsteps: 16
full_steps_per_rotation: 200

# --------------------------------------------------------------------------------
# SELECTOR SERVO -- MG996R, rotates the CAM shaft to engage one gate's lever
# against the shared gear stepper. There is no stepper_mmu_selector on this MMU.
# --------------------------------------------------------------------------------
[mmu_servo selector_servo]
pin: mmu:MMU_SEL_SERVO
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

# --------------------------------------------------------------------------------
# SENSORS
# --------------------------------------------------------------------------------
# Pre-gate sensors: one per gate. Pin mapping below matches the build guide's
# own reference wiring exactly (GATE0=PB6, GATE1=PB5, GATE2=PB7, GATE3=PB8 --
# note the guide's silkscreen order is not sequential, this is correct as
# written, not a typo). If you're building 5-6 gates, add
# pre_gate_switch_pin_4 (PB9) / _5 (PB4).
[mmu_sensors]
pre_gate_switch_pin_0: ^mmu:MMU_PRE_GATE_0
pre_gate_switch_pin_1: ^mmu:MMU_PRE_GATE_1
pre_gate_switch_pin_2: ^mmu:MMU_PRE_GATE_2
pre_gate_switch_pin_3: ^mmu:MMU_PRE_GATE_3

# No shared gate sensor on this build -- the guide is explicit that leaving this
# uncommented causes a false "filament already loaded" calibration error. Keep
# it commented out unless you added one yourself.
#gate_switch_pin: ^mmu:MMU_GATE_SENSOR

# No sync-feedback buffer/spring-arm sensor in the core BOM. Leave commented
# unless you added a Filamentalist-style buffer (the build guide recommends
# pairing this MMU with one: github.com/Carrot-collective/ERCF_v2, Filamentalist
# rewinder) with tension/compression switches.
#sync_feedback_tension_pin: <FILL_IN>
#sync_feedback_compression_pin: <FILL_IN>

# These two live on the RIGHT toolhead's own board (its EBB42, per RatOS's
# stock IDEX BOM), NOT the MMU's board. This is the critical sensor for this
# MMU -- with no gate sensor and no encoder, Happy Hare homes gate loads against
# this sensor (`gate_homing_endstop: extruder` in mmu_parameters_lowrider.cfg).
# Do not leave it unfitted/unset.
extruder_switch_pin: <FILL_IN: right-toolhead extruder-entrance sensor pin, e.g. an alias on that toolhead's own [board_pins] block>
toolhead_switch_pin: <FILL_IN: right-toolhead nozzle-side sensor pin, if fitted -- strongly recommended, see docs/01-hardware-overview.md>

# No encoder on this MMU (confirmed by build guide) -- intentionally no
# [mmu_encoder] section here.
