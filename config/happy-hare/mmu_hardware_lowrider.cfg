# Happy Hare hardware override for the Low Rider MMU v2.0 (4 gates)
#
# Destination: ~/printer_data/config/mmu/mmu_hardware_lowrider.cfg
# Include this AFTER Happy Hare's own generated `mmu/base/mmu_hardware.cfg` so these
# section overrides win (Klipper merges repeated section names across included
# files; values set here replace the generated defaults for the same keys).
#
# This assumes you completed the Happy Hare installer with MCU aliases already
# pointing at your MMU's actual board (i.e. `[mcu mmu]` and the `mmu:MMU_*` pin
# aliases already exist from the installer's generated `mmu/base/mmu.cfg`). Every
# `<FILL_IN: ...>` below is something that could not be verified automatically
# (printables.com / vendor pages are unreachable from this environment) — check it
# against your actual board silkscreen / schematic. See docs/01-hardware-overview.md.
#
# The Low Rider MMU v2.0 has no selector stage (one gear stepper per gate grips
# filament continuously), so this file intentionally does NOT define
# [stepper_mmu_selector] or [mmu_servo selector_servo] — those only apply to Type-A
# (ERCF/Tradrack-style) designs.

[mmu_machine]
num_gates: 4
mmu_vendor: Other
mmu_version: 1.0
selector_type: VirtualSelector		# no physical selector -- one gear stepper per gate
variable_bowden_lengths: 0		# 1 if your 4 gates have visibly different lengths to the merge point -- verify
variable_rotation_distances: 0		# 1 if the 4 gear drives are not identical -- verify against your BOM
require_bowden_move: 1			# there is a real Bowden tube from the merge point to the right toolhead
filament_always_gripped: 1		# Type-B gear steppers pinch filament continuously
has_bypass: 0				# set to 1 if your build has a manual bypass/PTFE-direct path

# --------------------------------------------------------------------------------
# GATE 0 gear stepper (also the "base" stepper_mmu_gear section)
# --------------------------------------------------------------------------------
[tmc2209 stepper_mmu_gear]
uart_pin: mmu:MMU_GEAR_UART
run_current: <FILL_IN: gear motor rated current, e.g. 0.6>
hold_current: 0.1
interpolate: True
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_mmu_gear]
step_pin: mmu:MMU_GEAR_STEP
dir_pin: !mmu:MMU_GEAR_DIR
enable_pin: !mmu:MMU_GEAR_ENABLE
rotation_distance: <FILL_IN: starter value, e.g. 22.6789 -- overridden by MMU_CALIBRATE_GEAR>
microsteps: 16
full_steps_per_rotation: 200		# 400 if your gate motors are 0.9 degree

# --------------------------------------------------------------------------------
# GATE 1-3 gear steppers (Type-B: one independent drive stepper per gate)
# --------------------------------------------------------------------------------
[tmc2209 stepper_mmu_gear_1]
uart_pin: mmu:MMU_GEAR_UART_1

[stepper_mmu_gear_1]
step_pin: mmu:MMU_GEAR_STEP_1
dir_pin: !mmu:MMU_GEAR_DIR_1
enable_pin: !mmu:MMU_GEAR_ENABLE_1

[tmc2209 stepper_mmu_gear_2]
uart_pin: mmu:MMU_GEAR_UART_2

[stepper_mmu_gear_2]
step_pin: mmu:MMU_GEAR_STEP_2
dir_pin: !mmu:MMU_GEAR_DIR_2
enable_pin: !mmu:MMU_GEAR_ENABLE_2

[tmc2209 stepper_mmu_gear_3]
uart_pin: mmu:MMU_GEAR_UART_3

[stepper_mmu_gear_3]
step_pin: mmu:MMU_GEAR_STEP_3
dir_pin: !mmu:MMU_GEAR_DIR_3
enable_pin: !mmu:MMU_GEAR_ENABLE_3

# --------------------------------------------------------------------------------
# SENSORS
# --------------------------------------------------------------------------------
# Pre-gate sensors: one per gate, detects filament loaded into that gate.
# Comment out any gate you don't have a sensor on -- Happy Hare treats a
# missing/empty pin as "sensor not fitted", not an error.
[mmu_sensors]
pre_gate_switch_pin_0: ^mmu:MMU_PRE_GATE_0
pre_gate_switch_pin_1: ^mmu:MMU_PRE_GATE_1
pre_gate_switch_pin_2: ^mmu:MMU_PRE_GATE_2
pre_gate_switch_pin_3: ^mmu:MMU_PRE_GATE_3

# Shared sensor at the point the 4 gates merge into one Bowden tube. With no
# encoder fitted (see below), this is what `mmu_parameters_lowrider.cfg` uses as
# the gate homing endstop (`gate_homing_endstop: mmu_gate`) -- fit one if you
# possibly can, it's the cheapest way to get reliable gate parking without an
# encoder. If you genuinely don't have one, comment this out and change
# `gate_homing_endstop` to `mmu_gear` (requires per-gate `post_gear_switch_pin_N`
# sensors instead) in `mmu_parameters_lowrider.cfg`.
gate_switch_pin: ^mmu:MMU_GATE_SENSOR

# These two live on the RIGHT toolhead's own MCU (the MMU-fed one), not the MMU's
# MCU -- e.g. a BTT EBB42-12 toolboard filament sensor pin. Fill in with that
# board's actual pin name/alias, not an `mmu:` one.
extruder_switch_pin: <FILL_IN: right-toolhead extruder-entrance sensor pin, if fitted>
toolhead_switch_pin: <FILL_IN: right-toolhead nozzle-side sensor pin, if fitted>

# --------------------------------------------------------------------------------
# ENCODER -- most low-part-count Type-B designs (including this one) skip a
# dedicated filament encoder and rely on gate/pre-gate sensors + gear-stepper
# collision homing instead. Leave this whole section commented out unless your
# specific build actually has an encoder wheel fitted.
# --------------------------------------------------------------------------------
#[mmu_encoder mmu_encoder]
#encoder_pin: ^mmu:MMU_ENCODER
#encoder_resolution: 0.7059		# starter value -- recalibrated automatically
#desired_headroom: 5.0
#average_samples: 4
#flowrate_samples: 20
