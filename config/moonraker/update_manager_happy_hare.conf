# Append to moonraker.conf if Happy Hare's install.sh didn't already add this
# (check for an existing [update_manager Happy-Hare] section first -- the
# installer normally adds one automatically).

[update_manager Happy-Hare]
type: git_repo
path: ~/Happy-Hare
origin: https://github.com/moggieuk/Happy-Hare.git
primary_branch: main
managed_services: klipper
