# IDEX <-> Happy Hare MMU integration macros
#
# Destination: ~/printer_data/config/RatOS/idex_mmu_integration.cfg (or anywhere;
# just update the [include ...] path in printer-overrides.cfg to match).
#
# Defines T2-T5 for the Low Rider MMU's 4 gates. Does NOT define T0 or T1 --
# those stay exactly as RatOS ships them. See docs/03-integration-architecture.md
# for why. Requires the one-time manual edit described in docs/02-installation.md
# step 3 (deleting Happy Hare's auto-generated T0-T3 in mmu_macro_vars.cfg).
#
# Include this AFTER:
#   - RatOS.cfg (needs _SELECT_TOOL and the dual_carriage object)
#   - Happy Hare's mmu.cfg / mmu_software.cfg (needs MMU_CHANGE_TOOL)

# ---------------------------------------------------------------------------
# Ensures the RIGHT toolhead (dual_carriage 1 / extruder1, the MMU-fed side) is
# the physically active carriage before an MMU gate change proceeds. No-ops
# (and doesn't move anything) if it's already active, so back-to-back gate
# changes during a multi-material print stay fast.
# ---------------------------------------------------------------------------
[gcode_macro _MMU_ENSURE_RIGHT_CARRIAGE]
gcode:
	{% set idex_mode = printer["dual_carriage"].carriage_1|default("")|lower %}
	{% if idex_mode == "copy" or idex_mode == "mirror" %}
		{action_raise_error("Cannot select an MMU gate while IDEX is in COPY/MIRROR mode. Run IDEX_SINGLE first.")}
	{% elif idex_mode != "primary" %}
		_SELECT_TOOL T=1
	{% endif %}

# ---------------------------------------------------------------------------
# MMU gate select macros. Slicer tool index -> gate index mapping is fixed at
# +2 (T2=gate0 .. T5=gate3) to leave RatOS's T0/T1 alone. If you change
# mmu_num_gates, add/remove blocks here, always starting at T2.
# ---------------------------------------------------------------------------
[gcode_macro T2]
gcode:
	_MMU_ENSURE_RIGHT_CARRIAGE
	MMU_CHANGE_TOOL TOOL=0

[gcode_macro T3]
gcode:
	_MMU_ENSURE_RIGHT_CARRIAGE
	MMU_CHANGE_TOOL TOOL=1

[gcode_macro T4]
gcode:
	_MMU_ENSURE_RIGHT_CARRIAGE
	MMU_CHANGE_TOOL TOOL=2

[gcode_macro T5]
gcode:
	_MMU_ENSURE_RIGHT_CARRIAGE
	MMU_CHANGE_TOOL TOOL=3
